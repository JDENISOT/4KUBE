apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetman-web-app
  namespace: fleetman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleetman-web-app
  template:
    metadata:
      labels:
        app: fleetman-web-app
    spec:
      containers:
        - name: web
          image: supinfo4kube/web-app:1.0.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: fleetman-web-app
  namespace: fleetman
spec:
  selector:
    app: fleetman-web-app
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080